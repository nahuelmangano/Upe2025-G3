<div class="card" style="margin-bottom:12px">
  <h3 class="h3" style="margin-bottom:12px">Documentos y estudios</h3>

  <div *ngIf="loading()">Cargando estudios...</div>
  <div *ngIf="error()" style="color:#d63031">{{ error() }}</div>

  <ng-container *ngIf="!loading() && !error()">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>Tipo de estudio</th>
            <th>Profesional</th>
            <th>Fecha de carga</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let es of pageItems()">
            <td>{{ es.tipo || '—' }}</td>
            <td>{{ es.profesional || '—' }}</td>
            <td>{{ es.fecha ? (es.fecha | date:'dd/MM/yyyy') : '—' }}</td>
          </tr>
          <tr *ngIf="!estudiosPaciente().length">
            <td colspan="3" style="text-align:center;color:#6b7280">Sin estudios</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:10px">
      <div style="display:flex; gap:8px; align-items:center">
        <small>Items per page:</small>
        <select [(ngModel)]="pageSize">
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
        </select>
      </div>
      <div style="display:flex; gap:10px; align-items:center">
        <small>{{ rangeLabel() }}</small>
        <button class="btn-outline" (click)="prev()" [disabled]="page===0"><</button>
        <button class="btn-outline" (click)="next()" [disabled]="(page+1)>=pagesCount()">></button>
      </div>
    </div>
  </ng-container>
</div>
