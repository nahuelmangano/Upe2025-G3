<h2 mat-dialog-title>{{tituloAccion}} Usuario</h2>

<mat-dialog-content>
  <form [formGroup]="formularioUsuario" class="usuario-form">
    <div class="form-grid">

      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput autocomplete="off" formControlName="nombre">
        <mat-icon matSuffix>account-box</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Apellido</mat-label>
        <input matInput autocomplete="off" formControlName="apellido">
        <mat-icon matSuffix>account-box</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mail</mat-label>
        <input matInput autocomplete="off" formControlName="mail">
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <ng-container *ngIf="datosUsuario != null">
        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estadoId">
            <mat-option *ngFor="let item of listaEstadosUsuarios" [value]="item.id">
              {{item.nombre}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </ng-container>

      <ng-container *ngIf="datosUsuario == null">
        <mat-form-field appearance="outline">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="rolId">
            <mat-option *ngFor="let item of listaRoles" [value]="item.id">
              {{item.nombre}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </ng-container>

      <ng-container *ngIf="mostrarCamposMedico">
        <mat-form-field appearance="outline">
          <mat-label>Matricula</mat-label>
          <input matInput autocomplete="off" formControlName="matricula">
          <mat-icon matSuffix>account-box</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>fechaVencimientoMatricula</mat-label>
          <input matInput autocomplete="off" formControlName="fechaVencimientoMatricula" type="date">
          <mat-icon matSuffix>calendar_today</mat-icon>
        </mat-form-field>
      </ng-container>

    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close color="warn">Volver</button>
  <button mat-raised-button color="primary" [disabled]="formularioUsuario.invalid"
    (click)="guardarEditarUsuario()">{{botonAccion}}</button>
</mat-dialog-actions>
