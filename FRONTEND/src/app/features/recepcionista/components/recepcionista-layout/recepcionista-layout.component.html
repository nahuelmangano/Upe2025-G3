<mat-toolbar #toolbarRef class="panel" color="primary" [style.position]="'fixed'" [style.width]="'100%'">
  <mat-toolbar-row class="toolbar-row">
    <div class="toolbar-left">
      <span class="color-primario mr titulo">UPE CLINICA</span>
      <button mat-icon-button class="menu-btn" (click)="toggleSidenav()">
        <mat-icon class="barra">menu</mat-icon>
      </button>
    </div>
    <div class="toolbar-right">
      <div class="medico-pill">
        <span class="medico-pill__label">Recepcionista</span>
        <span class="medico-pill__name">{{ usuarioNombre }}</span>
      </div>
      <button mat-stroked-button color="primary" class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container class="test"
  [style.marginTop.px]="toolbarHeight"
  [style.minHeight.px]="layoutHeight">
  <mat-sidenav #sidenav [opened]="isExpanded" class="contenedor-marco" [mode]="isDesktop ? 'side' : 'over'"
    [fixedInViewport]="!isDesktop" [fixedTopGap]="toolbarHeight"
    [style.paddingTop.px]="!isDesktop ? toolbarHeight : 0"
    (closedStart)="isExpanded=false"
    (openedStart)="isExpanded=true">
    <ng-container>
      <div class="side-panel">
        <nav class="nav default-nav">
          <a class="nav-link" [routerLink]="['/recepcionista', 'pacientes']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }" (click)="onNavClick(sidenav)"><span
              class="material-icons">person</span>Pacientes</a>
        </nav>
      </div>
    </ng-container>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="layout-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
